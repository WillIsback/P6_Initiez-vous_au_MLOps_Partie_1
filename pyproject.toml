[project]
name = "p6-initiez-vous-au-mlops-partie-1"
version = "0.1.0"
description = "Élaborez un modèle de scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "borutashap>=1.0.17",
    "gradio>=6.30.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "openfe>=0.0.12",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "ruff>=0.17.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "mlflow[extras]>=3.17.2",
]

[project.scripts]
mlflow-server = "mlflow.cli:cli"
